<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Аудит ККУС</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        :root { 
            --orange: #FF6600; 
            --yellow: #FFCC00; 
            --black: #000000; 
            --dark-gray: #333333; 
            --gray: #808080; 
            --light-gray: #F5F5F5; 
            --white: #FFFFFF;
            --success: #4CAF50;
            --danger: #F44336;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif; 
            background: var(--light-gray); 
            color: var(--black); 
            margin: 0; 
            padding: 0; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }
        
        #start-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            background: linear-gradient(135deg, var(--orange), var(--yellow));
        }
        
        .start-card {
            background: var(--white);
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        h1 { 
            font-size: 24px; 
            text-align: center; 
            color: var(--black); 
            margin: 0 0 20px; 
            font-weight: 700;
        }
        
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid var(--gray); 
            border-radius: 10px; 
            font-size: 17px; 
            margin-bottom: 14px; 
            background: var(--white);
            -webkit-appearance: none;
            font-family: inherit;
        }
        input:focus, textarea:focus { 
            outline: none; 
            border-color: var(--orange); 
        }
        input[type="date"] {
            background: var(--white);
            color: var(--black);
        }
        
        .btn-primary {
            background: var(--orange);
            color: var(--white);
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: all 0.2s;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }
        
        #audit-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
        }
        
        .header-bar {
            background: var(--black);
            color: var(--white);
            padding: 16px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
        }
        
        .question-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 16px;
            overflow-y: auto;
        }
        
        .question-card {
            background: var(--white);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            margin-bottom: 16px;
        }
        
        .question-number {
            font-size: 14px;
            color: var(--orange);
            font-weight: 700;
            margin-bottom: 8px;
        }
        
        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--black);
            margin-bottom: 16px;
            line-height: 1.4;
        }
        
        .flow-badge {
            display: inline-block;
            background: var(--yellow);
            color: var(--black);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        
        .method-box {
            background: var(--light-gray);
            padding: 16px;
            border-radius: 10px;
            font-size: 14px;
            color: var(--dark-gray);
            margin-bottom: 16px;
            line-height: 1.5;
            border-left: 4px solid var(--orange);
        }
        .method-box b { color: var(--orange); }
        
        .scores { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            margin-bottom: 16px; 
        }
        .score-btn { 
            padding: 16px 0; 
            text-align: center; 
            border: 2px solid var(--gray); 
            border-radius: 10px; 
            font-weight: 700; 
            font-size: 18px; 
            cursor: pointer; 
            transition: all 0.15s;
            background: var(--white);
            user-select: none;
        }
        .score-btn:active { transform: scale(0.95); }
        .score-btn.s2.active { background: var(--success); color: var(--white); border-color: var(--success); }
        .score-btn.s1.active { background: var(--yellow); color: var(--black); border-color: var(--yellow); }
        .score-btn.s0.active { background: var(--danger); color: var(--white); border-color: var(--danger); }
        .score-btn.sna.active { background: var(--gray); color: var(--white); border-color: var(--gray); }
        
        textarea { resize: none; }
        
        .nav-buttons {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: var(--white);
            border-top: 1px solid var(--light-gray);
        }
        
        .btn-nav {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-prev { background: var(--gray); color: var(--white); }
        .btn-next { background: var(--orange); color: var(--white); }
        .btn-save { background: var(--success); color: var(--white); }
        .btn-export { background: var(--black); color: var(--white); }
        
        .final-buttons {
            display: flex;
            gap: 12px;
            padding: 16px;
            background: var(--white);
            border-top: 1px solid var(--light-gray);
            flex-wrap: wrap;
        }
        
        .final-buttons .btn-nav {
            flex: 1;
            min-width: 100px;
        }
        
        .progress-indicator {
            text-align: center;
            padding: 8px;
            background: var(--light-gray);
            font-size: 14px;
            color: var(--gray);
            font-weight: 600;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="start-screen">
        <div class="start-card">
            <h1>📋 Аудит ККУС</h1>
            <input type="text" id="rc_name" placeholder="Название РЦ / Склада">
            <input type="date" id="audit_date">
            <input type="text" id="auditor" placeholder="ФИО Аудитора">
            <button class="btn-primary" onclick="startAudit()">ДАЛЕЕ</button>
        </div>
    </div>

    <div id="audit-screen">
        <div class="header-bar">
            РЦ: <span id="display-rc"></span> | Аудитор: <span id="display-auditor"></span>
        </div>
        
        <div class="progress-indicator" id="progress">Вопрос 1 из 15</div>
        
        <div class="question-container" id="question-container"></div>
        
        <div class="nav-buttons" id="nav-buttons">
            <button class="btn-nav btn-prev" onclick="prevQuestion()">← Назад</button>
            <button class="btn-nav btn-next" onclick="nextQuestion()">Далее →</button>
        </div>
        
        <div class="final-buttons hidden" id="final-buttons">
            <button class="btn-nav btn-prev" onclick="prevQuestion()">← Назад</button>
            <button class="btn-nav btn-save" onclick="saveAudit()">💾 Сохранить</button>
            <button class="btn-nav btn-export" onclick="exportToExcel()">📊 Скачать Excel</button>
        </div>
    </div>

    <script>
        const data = [
            { cat: "ЗОНЫ ХРАНЕНИЯ И ПИКИНГА", id: "1.1", req: "За цикл просчитаны все ячейки согласно графику ЦИ", method: "Проверить отчёт по инвентаризации. Все ли ячейки были просчитаны за последний цикл ЦИ?", flow: "СТОК" },
            { cat: "ЗОНЫ ХРАНЕНИЯ И ПИКИНГА", id: "1.2", req: "Проведена выборочная проверка аллей на «пусто-занято»", method: "Выгрузить размещение-пополнение-перемещение за 7 дней. Удалить дубликаты, сделать ВПР с отчётом стока по местам, отсортировать по аллеям. Сформировать список 100–200 адресов для проверки. Все паллеты физически находятся по адресу в WMS.", flow: "СТОК" },
            { cat: "ЗОНЫ ХРАНЕНИЯ И ПИКИНГА", id: "1.3", req: "Ячейки хранения чистые, без повреждений, стеллажи промаркированы", method: "Визуальный осмотр ячеек хранения. Проверить наличие и читаемость этикеток, отсутствие повреждений.", flow: "СТОК" },
            { cat: "ЗОНЫ ХРАНЕНИЯ И ПИКИНГА", id: "1.4", req: "Соблюдение товарного соседства в зонах хранения", method: "Проверка размещения товаров согласно правилам товарного соседства. Отсутствие конфликтов.", flow: "СТОК" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.1", req: "Отсутствие в DOC, ZDO, OUT отменённых заказов > 24 часов", method: "Анализ отчёта «Мониторинг отгрузки». В зонах не должно быть заказов, отменённых более 24 часов назад. Отсутствие артикулов без блока и резерва.", flow: "СТОК" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.2", req: "Время нахождения товара в зоне RZ не превышает 6 часов", method: "Анализ отчёта D2S (дата размещения). Время нахождения в зоне RZ не должно превышать 6 часов.", flow: "СТОК" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.3", req: "Актуальность данных в ячейках довоза, обмена, переносов", method: "Выборочная проверка 5–7 заказов в зоне довозов и переносов. Товар должен соответствовать WMS, даты актуальны.", flow: "СТОК" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.4", req: "Отсутствие отменённых заказов, не разобранных > 12 часов (3ч для ДС с ДВД)", method: "Проверка отчётов WMS по отменённым заказам. Не должно быть отменённых заказов, не разобранных более 12 часов.", flow: "СТОК" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.5", req: "Виртуальные зоны пусты, буферные не содержат паллет > 12 часов", method: "Проверка отчёта стока по местам или WMS Stock It Easy. Не должно быть зависших паллет. В случае вынужденного размещения — информационное письмо.", flow: "Все потоки" },
            { cat: "ОПЕРАЦИОННЫЕ ЗОНЫ", id: "2.6", req: "Зона приёмки организована, товары размещены по правилам", method: "Визуальный осмотр зоны приёмки. Проверка организации пространства и соблюдения правил размещения.", flow: "СТОК" },
            { cat: "АНОМАЛЬНЫЕ ЗОНЫ", id: "3.1", req: "Соответствие физ. товара в аномальных зонах данным WMS и наличие актов", method: "Сверка содержимого аномальных ячеек с реестрами и актами. Физический товар должен соответствовать WMS.", flow: "СТОК ДС / Все потоки РЦ" },
            { cat: "АНОМАЛЬНЫЕ ЗОНЫ", id: "3.2", req: "Соблюдение регламентов и сроков обработки блокировок", method: "Анализ времени нахождения товара в блокировках. Сроки обработки блокировок должны соблюдаться.", flow: "СТОК ДС / Все потоки РЦ" },
            { cat: "АНОМАЛЬНЫЕ ЗОНЫ", id: "3.3", req: "Зона брака организована, товары промаркированы и изолированы", method: "Визуальный осмотр зоны брака. Проверка маркировки и изоляции бракованного товара.", flow: "Все потоки" },
            { cat: "ИНТЕГРАЦИЯ RMS-WMS", id: "4.1", req: "Кол-во заблокированного товара идентично в WMS и RMS", method: "Сравнение выгрузок из WMS и RMS. Данные по заблокированному товару должны совпадать.", flow: "СТОК ДС / Все потоки РЦ" },
            { cat: "ИНТЕГРАЦИЯ RMS-WMS", id: "4.2", req: "Все трансферы имеют статус «Отгружен» в обеих системах", method: "Анализ отчёта по трансферам/возвратам. В статусе «Отгружен» не должно быть расхождений между WMS и RMS.", flow: "СТОК ДС / Все потоки РЦ" },
            { cat: "ИНТЕГРАЦИЯ RMS-WMS", id: "4.3", req: "В RMS отсутствует товар, заблокированный как «кража»", method: "Проверка отчёта сток RMS, сверка с Актами МП8 (по инструкции).", flow: "Импорт / СТОК РЦ" },
            { cat: "ИНТЕГРАЦИЯ RMS-WMS", id: "4.4", req: "Нет «старых утверждённых трансферов» свыше 72 часов (исходящих)", method: "Проверка по отчёту «Реестр трансферов» и «Интеграция трансферов WMS/RMS». Все утверждённые трансферы собраны и отгружены по KPI.", flow: "Все потоки" },
            { cat: "ИНТЕГРАЦИЯ RMS-WMS", id: "4.5", req: "Процент расхождений стока WMS и RMS не превышает 0,20%", method: "Проверка по отчёту «Сверка стоков WMS-RMS».", flow: "РЦ" }
        ];

        let currentQuestion = 0;
        let auditData = { rc: "", date: "", auditor: "", scores: new Array(data.length).fill(null), comments: new Array(data.length).fill("") };

        window.onload = function() {
            const saved = localStorage.getItem('kkuks_audit_data');
            if (saved) {
                const parsed = JSON.parse(saved);
                document.getElementById('rc_name').value = parsed.rc || "";
                document.getElementById('audit_date').value = parsed.date || "";
                document.getElementById('auditor').value = parsed.auditor || "";
                auditData = parsed;
            } else {
                document.getElementById('audit_date').value = new Date().toISOString().split('T')[0];
            }
        };

        function startAudit() {
            const rc = document.getElementById('rc_name').value.trim();
            const date = document.getElementById('audit_date').value;
            const auditor = document.getElementById('auditor').value.trim();

            if (!rc || !date || !auditor) {
                alert("⚠️ Заполните все поля: Название РЦ, Дата и ФИО Аудитора");
                return;
            }

            auditData.rc = rc;
            auditData.date = date;
            auditData.auditor = auditor;

            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('audit-screen').style.display = 'flex';
            
            document.getElementById('display-rc').textContent = rc;
            document.getElementById('display-auditor').textContent = auditor;

            renderQuestion();
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            const item = data[currentQuestion];

            container.innerHTML = '<div class="question-card">' +
                '<div class="question-number">Вопрос ' + (currentQuestion + 1) + '</div>' +
                '<div class="flow-badge">' + item.flow + '</div>' +
                '<div class="question-text">' + item.id + '. ' + item.req + '</div>' +
                '<div class="method-box"><b>Как проверяем:</b><br>' + item.method + '</div>' +
                '<div class="scores">' +
                '<div class="score-btn s2 ' + (auditData.scores[currentQuestion] === 2 ? 'active' : '') + '" onclick="setScore(2)">2</div>' +
                '<div class="score-btn s1 ' + (auditData.scores[currentQuestion] === 1 ? 'active' : '') + '" onclick="setScore(1)">1</div>' +
                '<div class="score-btn s0 ' + (auditData.scores[currentQuestion] === 0 ? 'active' : '') + '" onclick="setScore(0)">0</div>' +
                '<div class="score-btn sna ' + (auditData.scores[currentQuestion] === 'Н/П' ? 'active' : '') + '" onclick="setScore(\'Н/П\')">Н/П</div>' +
                '</div>' +
                '<textarea rows="3" placeholder="Комментарии / Наблюдения..." oninput="saveComment(this.value)">' + (auditData.comments[currentQuestion] || '') + '</textarea>' +
                '</div>';

            document.getElementById('progress').textContent = 'Вопрос ' + (currentQuestion + 1) + ' из ' + data.length;

            const navButtons = document.getElementById('nav-buttons');
            const finalButtons = document.getElementById('final-buttons');
            const prevBtn = navButtons.querySelector('.btn-prev');

            if (currentQuestion === 0) {
                prevBtn.style.opacity = '0.5';
                prevBtn.disabled = true;
            } else {
                prevBtn.style.opacity = '1';
                prevBtn.disabled = false;
            }

            if (currentQuestion === data.length - 1) {
                navButtons.classList.add('hidden');
                finalButtons.classList.remove('hidden');
            } else {
                navButtons.classList.remove('hidden');
                finalButtons.classList.add('hidden');
            }

            saveToLocalStorage();
        }

        function setScore(score) {
            auditData.scores[currentQuestion] = score;
            renderQuestion();
        }

        function saveComment(comment) {
            auditData.comments[currentQuestion] = comment;
            saveToLocalStorage();
        }

        function prevQuestion() {
            if (currentQuestion > 0) {
                currentQuestion--;
                renderQuestion();
            }
        }

        function nextQuestion() {
            if (currentQuestion < data.length - 1) {
                currentQuestion++;
                renderQuestion();
            }
        }

        function saveToLocalStorage() {
            localStorage.setItem('kkuks_audit_data', JSON.stringify(auditData));
        }

        function saveAudit() {
            saveToLocalStorage();
            alert("✅ Аудит сохранён в памяти браузера!\n\nВы можете закрыть страницу и вернуться позже — все данные сохранятся.");
        }

        function exportToExcel() {
            const rc = auditData.rc;
            const date = auditData.date;
            const auditor = auditData.auditor;

            let csv = '\uFEFF';
            csv += "РЦ;Дата;Аудитор;;;\n";
            csv += rc + ";" + date + ";" + auditor + ";;;\n\n";
            csv += "№;Категория;Требование;Поток;Оценка;Комментарий\n";

            data.forEach((item, idx) => {
                const score = auditData.scores[idx] !== null ? auditData.scores[idx] : "";
                const comment = (auditData.comments[idx] || "").replace(/;/g, ",");
                csv += item.id + ";" + item.cat + ";" + item.req + ";" + item.flow + ";" + score + ";" + comment + "\n";
            });

            let sum = 0, count = 0;
            auditData.scores.forEach(s => {
                if (s !== null && s !== 'Н/П') {
                    sum += s;
                    count++;
                }
            });
            const avg = count > 0 ? (sum / count).toFixed(2) : "—";
            
            csv += "\nИТОГОВЫЙ БАЛЛ;" + avg + "\n";

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);
            link.setAttribute('href', url);
            link.setAttribute('download', "Аудит_ККУС_" + rc + "_" + date + ".csv");
            link.style.visibility = 'hidden';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    </script>
</body>
</html>
